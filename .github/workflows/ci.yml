name: CI

on:
  push:
    branches: [ "develop" ]

jobs:
  Build:
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24.x'
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: |
        dotnet restore
        cd get-typescript-api-json
        npm install
    - name: Build get-typescript-api-json
      run: |
        cd get-typescript-api-json
        npm run build
    - name: Build assemblies
      run: dotnet build -c Release -p:BuildNumber=${{github.run_number}} -p:RunNPMInstall=false -p:RunNPMBuild=false --no-restore
    - name: Build NuGet packages
      run: |
        cd InsightDocs
        dotnet pack -c Release -p:BuildNumber=${{github.run_number}} --no-build
        cd ../InsightDocs.Sqlite
        dotnet pack -c Release -p:BuildNumber=${{github.run_number}} --no-build
        cd ../InsightDocs.Templates.MicrosoftLearn
        dotnet pack -c Release -p:BuildNumber=${{github.run_number}} --no-build
    - name: Add GitHub Packages source
      run: dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
    - name: Publish NuGet packages
      run: dotnet nuget push "**/*.nupkg" --source "github" --api-key "${{ secrets.GITHUB_TOKEN }}"
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
